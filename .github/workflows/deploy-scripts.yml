name: Deploy scripts

on:
  push:
    paths: ['deploy/**', '.github/workflows/deploy-scripts.yml']
  pull_request:
    paths: ['deploy/**', '.github/workflows/deploy-scripts.yml']

concurrency:
  group: deploy-scripts-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    name: Rehearse deploy and rollback
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check every script
        run: |
          set -euo pipefail
          find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n
          echo "All deploy scripts parse."

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files are not present in the checkout.
          find deploy -name '*.sh' -print0 | xargs -0 shellcheck -e SC1091 -S warning

      # The failure this guards is the quietest one in the whole deploy: a
      # provider secret left blank or still on its local placeholder does not
      # crash anything, it just makes every signature verification fail.
      - name: Secrets generator fills what it can and refuses what it cannot
        run: |
          set -euo pipefail
          ./deploy/generate-secrets.sh production > /tmp/generated.env

          if ./deploy/generate-secrets.sh production --check /tmp/generated.env 2>/dev/null; then
            echo "::error::--check passed a file with every provider value blank"
            exit 1
          fi

          for key in PAYMOB_API_KEY PAYMOB_INTEGRATION_ID PAYMOB_IFRAME_ID PAYMOB_HMAC_SECRET \
                     FAWRY_MERCHANT_CODE FAWRY_SECURITY_KEY BEON_API_KEY BEON_WEBHOOK_SECRET \
                     SENTRY_LARAVEL_DSN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET; do
            sed -i "s|^${key}=.*|${key}=filled-$(openssl rand -hex 4)|" /tmp/generated.env
          done
          ./deploy/generate-secrets.sh production --check /tmp/generated.env

          sed -i 's|^PAYMOB_HMAC_SECRET=.*|PAYMOB_HMAC_SECRET=local-paymob-hmac-secret|' /tmp/generated.env
          if ./deploy/generate-secrets.sh production --check /tmp/generated.env 2>/dev/null; then
            echo "::error::--check passed a file still carrying a local placeholder"
            exit 1
          fi

      # Provisioning cannot be rehearsed for real without a server, but it can
      # be made to state every command it would run before it runs one.
      - name: Provisioning is readable before it is run
        run: ./deploy/provision.sh production --dry-run

      # The parts that only matter when something goes wrong — the atomic
      # swap, the health gate, rollback after a bad release is already live,
      # and pruning that must never delete the release currently serving.
      # Rehearsing them in CI means the first time they run is not an outage.
      - name: Rehearse
        run: bash deploy/rehearse-deploy.sh "${RUNNER_TEMP}/kaabosh-deploy-rehearsal"

  backup-scripts:
    name: Backup and restore drill
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16

      # Runs the real thing: archive WAL, take a base backup, write more data,
      # restore, and assert the post-backup rows came back. This is the claim
      # behind WAL archiving, and it is worth re-proving on every change to
      # these scripts.
      - name: Backup, write, restore, verify
        run: |
          set -euo pipefail
          sudo install -m 0755 deploy/backup/kaabosh-archive-wal.sh /usr/local/bin/kaabosh-archive-wal.sh
          sudo mkdir -p /var/backups/kaabosh/{wal,base}
          sudo chown -R postgres:postgres /var/backups/kaabosh

          sudo tee -a /etc/postgresql/16/main/postgresql.conf < deploy/backup/postgresql-archiving.conf > /dev/null
          # Prepended, not appended. pg_hba.conf is first-match-wins and
          # Debian ships a scram-sha-256 line for 127.0.0.1, so trust rules
          # added at the end never match — pg_basebackup asks for a password
          # nobody can supply and the drill fails at the first step.
          sudo sed -i '1i host replication all 127.0.0.1/32 trust' /etc/postgresql/16/main/pg_hba.conf
          sudo sed -i '1i host all all 127.0.0.1/32 trust' /etc/postgresql/16/main/pg_hba.conf
          sudo pg_ctlcluster 16 main restart
          sleep 5

          sudo -u postgres psql -qc "CREATE DATABASE kaabosh"
          sudo -u postgres psql -d kaabosh -qc "CREATE TABLE tenants (id serial primary key, name text)"
          sudo -u postgres psql -d kaabosh -qc "INSERT INTO tenants (name) SELECT 'before-'||g FROM generate_series(1,5) g"

          sudo -u postgres env PGUSER=postgres bash deploy/backup/postgres-backup.sh

          # Written AFTER the base backup: only WAL replay can bring these back.
          sudo -u postgres psql -d kaabosh -qc "INSERT INTO tenants (name) SELECT 'after-'||g FROM generate_series(1,20) g"
          sudo -u postgres psql -qc "SELECT pg_switch_wal()"
          sleep 3

          sudo chown -R postgres:postgres /var/backups/kaabosh
          sudo -u postgres env \
            KAABOSH_DRILL_DIR=/var/tmp/kaabosh-drill \
            KAABOSH_PG_BIN=/usr/lib/postgresql/16/bin \
            KAABOSH_DRILL_MIN_TENANTS=25 \
            KAABOSH_DRILL_MIN_POLICIES=0 \
            KAABOSH_DRILL_DATABASE=kaabosh \
            bash deploy/backup/restore-drill.sh
