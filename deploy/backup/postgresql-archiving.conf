# Continuous WAL archiving. Append to postgresql.conf and restart.
#
# This is what turns "we lose up to a day" into "we lose up to a few minutes".
# Without it, a base backup is only as fresh as the night it was taken.

# 'replica' is enough for archiving and streaming replication. 'logical' is
# only needed for logical decoding and costs extra WAL volume.
wal_level = replica

archive_mode = on

# %p is the file to archive, %f its name. The command must return non-zero on
# failure — Postgres retries, and a silently-failing archive command is how a
# recovery window quietly disappears.
archive_command = '/usr/local/bin/kavo-archive-wal.sh %p %f'

# Cap how long a low-traffic period can leave the last segment unarchived.
# Without it a quiet hour means an hour of unprotected writes.
archive_timeout = 300

# Headroom for the archiver and for a replica that falls behind, so a slow
# archive does not force WAL recycling and break the chain.
max_wal_size = 2GB
min_wal_size = 512MB
wal_keep_size = 1GB

# Slots for a future streaming replica (ADR 0001 §8, Phase 1).
max_wal_senders = 5
max_replication_slots = 5
