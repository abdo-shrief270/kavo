# Module boundaries, enforced by CI rather than by code review.
#
# The rules are the ones in ADR 0001: a Platform module may never reach into
# a vertical, and modules talk through contracts and events rather than each
# other's Eloquent models. Deptrac is what keeps that true after the third
# deadline.
deptrac:
  paths:
    - ./app

  layers:
    - name: Shared
      collectors:
        - type: directory
          value: app/Shared/.*

    - name: Support
      collectors:
        - type: directory
          value: app/Support/.*

    - name: Models
      collectors:
        - type: directory
          value: app/Models/.*

    - name: Providers
      collectors:
        - type: directory
          value: app/Providers/.*

    - name: Http
      collectors:
        - type: directory
          value: app/Http/.*

    - name: Identity
      collectors:
        - type: directory
          value: app/Modules/Platform/Identity/.*

    - name: Billing
      collectors:
        - type: directory
          value: app/Modules/Platform/Billing/.*

    - name: Entitlements
      collectors:
        - type: directory
          value: app/Modules/Platform/Entitlements/.*

    - name: Domains
      collectors:
        - type: directory
          value: app/Modules/Platform/Domains/.*

    - name: Themes
      collectors:
        - type: directory
          value: app/Modules/Platform/Themes/.*

    - name: Media
      collectors:
        - type: directory
          value: app/Modules/Platform/Media/.*

    - name: Notifications
      collectors:
        - type: directory
          value: app/Modules/Platform/Notifications/.*

    - name: Webhooks
      collectors:
        - type: directory
          value: app/Modules/Platform/Webhooks/.*

    - name: Realtime
      collectors:
        - type: directory
          value: app/Modules/Platform/Realtime/.*

    - name: Analytics
      collectors:
        - type: directory
          value: app/Modules/Platform/Analytics/.*

    - name: Audit
      collectors:
        - type: directory
          value: app/Modules/Platform/Audit/.*

    # Added in a later slice and never registered here. With
    # --fail-on-uncovered that is not a gap the gate tolerates — it is the
    # gate failing, which nobody saw because the gate had never run.
    - name: Observability
      collectors:
        - type: directory
          value: app/Modules/Platform/Observability/.*

  ruleset:
    # Everything may use the shared contracts, enums and tenancy primitives.
    # That is what Shared is for.
    #
    # Identity is here because Shared's subject is tenancy and a tenancy
    # primitive deals in tenants: the context that holds one, the trait that
    # scopes a model to one, the entitlements contract and the quota event all
    # name the Tenant model, which lives in Identity. Moving Tenant into Shared
    # would put an Eloquent model in the layer meant for contracts, and an
    # interface would not survive BelongsToTenant, which needs the concrete
    # class for belongsTo().
    #
    # And it is not only Identity: the payment contract speaks in Billing's
    # value objects, the entitlements contract in Entitlements', the WhatsApp
    # one in Notifications'. Only the interfaces were hoisted, not their
    # vocabulary.
    #
    # This is coarser than the design — it permits Shared to reach anything in
    # those four modules, where only eight named classes are intended. The
    # precise list is pinned by ArchitectureTest, which can be run; this
    # cannot say it without a config Deptrac 2 refuses to load.
    Shared:
      - Models
      - Identity
      - Billing
      - Entitlements
      - Notifications
    Support: ~
    Models:
      - Shared
      - Identity

    # Identity is the root of tenancy: every module resolves a tenant, so
    # every module may depend on it. It depends on no other module.
    Identity:
      - Shared
      - Support
      - Models
      - Domains
      - Billing
      - Audit

    Billing:
      - Shared
      - Support
      - Models
      - Identity
      - Audit

    Entitlements:
      - Shared
      - Support
      - Models
      - Identity
      - Billing

    Domains:
      - Shared
      - Support
      - Models
      - Identity
      - Audit

    Themes:
      - Shared
      - Support
      - Models
      - Identity
      - Audit

    Media:
      - Shared
      - Support
      - Models
      - Identity
      # Uploads are audited like every other tenant-visible write. Audit was
      # listed for every module that records one except this one.
      - Audit

    Notifications:
      - Shared
      - Support
      - Models
      - Identity
      # Realtime is a delivery channel like mail or WhatsApp, and choosing
      # channels is what this module is for.
      - Realtime

    Webhooks:
      - Shared
      - Support
      - Models
      - Identity
      - Audit

    Realtime:
      - Shared
      - Support
      - Models
      - Identity

    Analytics:
      - Shared
      - Support
      - Models
      - Identity
      - Audit

    Audit:
      - Shared
      - Support
      - Models
      - Identity

    Observability:
      - Shared
      - Support
      - Models
      - Identity

    Providers:
      - Shared
      - Support
      - Models
      - Identity
      - Billing
      - Entitlements
      - Domains
      - Themes
      - Media
      - Notifications
      - Webhooks
      - Realtime
      - Analytics
      - Audit
      - Observability

    Http:
      - Shared
      - Support
      - Models
